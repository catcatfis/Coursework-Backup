<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('作业项目管理')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container">
    <div class="card">
        <div class="card-header bg-danger text-white">
            <h5 th:text="${action == 'add' ? '新增作业项目' : '修改作业项目'}"></h5>
        </div>
        <div class="card-body">
            <form action="/manage/task/save" method="post">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">单据号</label>
                        <input type="text" name="tid" class="form-control" th:value="${task.tid}"
                               th:readonly="${action == 'edit'}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">单位代码</label>
                        <select name="dpid" class="form-select" required>
                            <option th:each="d : ${departments}" th:value="${d.dpid}" th:text="${d.dpid + ' - ' + d.dname}"
                                    th:selected="${d.dpid == task.dpid}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">井号</label>
                        <select name="owid" class="form-select" required>
                            <option th:each="ow : ${oilWaters}" th:value="${ow.owid}" th:text="${ow.owid + ' - ' + ow.owname}"
                                    th:selected="${ow.owid == task.owid}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">预算金额</label>
                        <input type="number" step="0.01" name="budgetamount" class="form-control" th:value="${task.budgetamount}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">预算人</label>
                        <input type="text" name="budgeter" class="form-control" th:value="${task.budgeter}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">预算日期</label>
                        <input type="date" name="budgetdate" class="form-control" th:value="${task.budgetdate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">开工日期</label>
                        <input type="date" name="startdate" class="form-control" th:value="${task.startdate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">完工日期</label>
                        <input type="date" name="enddate" class="form-control" th:value="${task.enddate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">施工单位</label>
                        <select name="cname" class="form-select">
                            <option value="">请选择</option>
                            <option th:each="c : ${constructions}" th:value="${c.cname}" th:text="${c.cname}"
                                    th:selected="${c.cname == task.cname}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">施工内容</label>
                        <input type="text" name="constructionContent" class="form-control" th:value="${task.constructionContent}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">材料费</label>
                        <input type="number" step="0.01" name="materialcost" class="form-control" th:value="${task.materialcost}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">人工费</label>
                        <input type="number" step="0.01" name="laborcost" class="form-control" th:value="${task.laborcost}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">设备费</label>
                        <input type="number" step="0.01" name="equipmentcost" class="form-control" th:value="${task.equipmentcost}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">其它费</label>
                        <input type="number" step="0.01" name="othercost" class="form-control" th:value="${task.othercost}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">结算金额</label>
                        <input type="number" step="0.01" name="settlementamount" class="form-control" th:value="${task.settlementamount}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">结算人</label>
                        <input type="text" name="settlementer" class="form-control" th:value="${task.settlementer}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">结算日期</label>
                        <input type="date" name="settlementdate" class="form-control" th:value="${task.settlementdate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">入账金额</label>
                        <input type="number" step="0.01" name="amountcredited" class="form-control" th:value="${task.amountcredited}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">入账人</label>
                        <input type="text" name="amountcrediter" class="form-control" th:value="${task.amountcrediter}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">入账日期</label>
                        <input type="date" name="amountcreditedate" class="form-control" th:value="${task.amountcreditedate}">
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="/manage" class="btn btn-secondary">返回</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
