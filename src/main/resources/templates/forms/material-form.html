<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('材料消耗管理')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-secondary text-white">
                    <h5>新增材料消耗</h5>
                </div>
                <div class="card-body">
                    <form action="/manage/material/save" method="post">
                        <div class="mb-3">
                            <label class="form-label">作业单据号</label>
                            <select name="tid" class="form-select" required>
                                <option value="">请选择</option>
                                <option th:each="t : ${tasks}" th:value="${t.tid}" th:text="${t.tid}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">物料代码</label>
                            <select name="itemid" class="form-select" required>
                                <option value="">请选择</option>
                                <option th:each="i : ${items}" th:value="${i.itemid}" th:text="${i.itemid + ' - ' + i.itemname}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">数量</label>
                            <input type="number" name="quantity" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">金额</label>
                            <input type="number" step="0.01" name="price" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a href="/manage" class="btn btn-secondary">返回</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
