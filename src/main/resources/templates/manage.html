<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('数据管理 - 采油厂油水井作业成本管理系统')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container-fluid px-4">
    <!-- 提示消息 -->
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- 单位代码表 -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center bg-primary text-white">
            <h5 class="mb-0">单位代码表</h5>
            <a href="/manage/department/add" class="btn btn-light btn-sm">新增</a>
        </div>
        <div class="card-body table-responsive">
            <table class="table table-bordered table-hover">
                <thead><tr><th>单位代码</th><th>单位名称</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="d : ${departments}">
                    <td th:text="${d.dpid}"></td>
                    <td th:text="${d.dname}"></td>
                    <td>
                        <a th:href="@{/manage/department/edit/{id}(id=${d.dpid})}" class="btn btn-warning btn-sm">修改</a>
                        <a th:href="@{/manage/department/delete/{id}(id=${d.dpid})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('确认删除？')">删除</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 油水井表 -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center bg-info text-white">
            <h5 class="mb-0">油水井表</h5>
            <a href="/manage/oilwater/add" class="btn btn-light btn-sm">新增</a>
        </div>
        <div class="card-body table-responsive">
            <table class="table table-bordered table-hover">
                <thead><tr><th>井号</th><th>井类型</th><th>所属单位代码</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="ow : ${oilWaters}">
                    <td th:text="${ow.owid}"></td>
                    <td th:text="${ow.owname}"></td>
                    <td th:text="${ow.dpid}"></td>
                    <td>
                        <a th:href="@{/manage/oilwater/edit/{id}(id=${ow.owid})}" class="btn btn-warning btn-sm">修改</a>
                        <a th:href="@{/manage/oilwater/delete/{id}(id=${ow.owid})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('确认删除？')">删除</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 施工单位表 -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center bg-warning text-dark">
            <h5 class="mb-0">施工单位表</h5>
            <a href="/manage/constructio/add" class="btn btn-light btn-sm">新增</a>
        </div>
        <div class="card-body table-responsive">
            <table class="table table-bordered table-hover">
                <thead><tr><th>施工单位名称</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="c : ${constructions}">
                    <td th:text="${c.cname}"></td>
                    <td>
                        <a th:href="@{/manage/constructio/delete/{name}(name=${c.cname})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('确认删除？')">删除</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 物码表 -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center bg-success text-white">
            <h5 class="mb-0">物码表</h5>
            <a href="/manage/item/add" class="btn btn-light btn-sm">新增</a>
        </div>
        <div class="card-body table-responsive">
            <table class="table table-bordered table-hover">
                <thead><tr><th>物料代码</th><th>物料名称</th><th>单位</th><th>单价</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="item : ${items}">
                    <td th:text="${item.itemid}"></td>
                    <td th:text="${item.itemname}"></td>
                    <td th:text="${item.unit}"></td>
                    <td th:text="${item.uprice}"></td>
                    <td>
                        <a th:href="@{/manage/item/edit/{id}(id=${item.itemid})}" class="btn btn-warning btn-sm">修改</a>
                        <a th:href="@{/manage/item/delete/{id}(id=${item.itemid})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('确认删除？')">删除</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 作业表 -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center bg-danger text-white">
            <h5 class="mb-0">作业表</h5>
            <a href="/manage/task/add" class="btn btn-light btn-sm">新增</a>
        </div>
        <div class="card-body table-responsive">
            <table class="table table-bordered table-hover table-sm">
                <thead><tr>
                    <th>单据号</th><th>单位代码</th><th>井号</th><th>预算金额</th><th>预算人</th>
                    <th>预算日期</th><th>开工日期</th><th>完工日期</th><th>施工单位</th><th>施工内容</th>
                    <th>材料费</th><th>人工费</th><th>设备费</th><th>其它费</th>
                    <th>结算金额</th><th>结算人</th><th>结算日期</th>
                    <th>入账金额</th><th>入账人</th><th>入账日期</th><th>操作</th>
                </tr></thead>
                <tbody>
                <tr th:each="t : ${tasks}">
                    <td th:text="${t.tid}"></td>
                    <td th:text="${t.dpid}"></td>
                    <td th:text="${t.owid}"></td>
                    <td th:text="${t.budgetamount}"></td>
                    <td th:text="${t.budgeter}"></td>
                    <td th:text="${t.budgetdate}"></td>
                    <td th:text="${t.startdate}"></td>
                    <td th:text="${t.enddate}"></td>
                    <td th:text="${t.cname}"></td>
                    <td th:text="${t.constructionContent}"></td>
                    <td th:text="${t.materialcost}"></td>
                    <td th:text="${t.laborcost}"></td>
                    <td th:text="${t.equipmentcost}"></td>
                    <td th:text="${t.othercost}"></td>
                    <td th:text="${t.settlementamount}"></td>
                    <td th:text="${t.settlementer}"></td>
                    <td th:text="${t.settlementdate}"></td>
                    <td th:text="${t.amountcredited}"></td>
                    <td th:text="${t.amountcrediter}"></td>
                    <td th:text="${t.amountcreditedate}"></td>
                    <td>
                        <a th:href="@{/manage/task/edit/{id}(id=${t.tid})}" class="btn btn-warning btn-sm">修改</a>
                        <a th:href="@{/manage/task/delete/{id}(id=${t.tid})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('确认删除？')">删除</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 材料消耗表 -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center bg-secondary text-white">
            <h5 class="mb-0">材料消耗表</h5>
            <a href="/manage/material/add" class="btn btn-light btn-sm">新增</a>
        </div>
        <div class="card-body table-responsive">
            <table class="table table-bordered table-hover">
                <thead><tr><th>作业单据号</th><th>物料代码</th><th>数量</th><th>金额</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="mc : ${materialConsumptions}">
                    <td th:text="${mc.tid}"></td>
                    <td th:text="${mc.itemid}"></td>
                    <td th:text="${mc.quantity}"></td>
                    <td th:text="${mc.price}"></td>
                    <td>
                        <a th:href="@{/manage/material/delete(tid=${mc.tid},itemid=${mc.itemid})}"
                           class="btn btn-danger btn-sm" onclick="return confirm('确认删除？')">删除</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
